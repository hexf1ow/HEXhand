name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release versions
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Verify tag, npm, and Cargo versions match
        run: |
          npm_version="$(node -p "require('./package.json').version")"
          cargo_version="$(cargo +stable metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "hexhand") | .version')"

          test -n "${cargo_version}"
          test "${npm_version}" = "${cargo_version}"
          test "${GITHUB_REF_NAME}" = "v${npm_version}"

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: hexhand-linux-x64
            target: x86_64-unknown-linux-musl
            binary: target/x86_64-unknown-linux-musl/release/hexhand
          - runner: ubuntu-22.04-arm
            asset: hexhand-linux-arm64
            target: aarch64-unknown-linux-musl
            binary: target/aarch64-unknown-linux-musl/release/hexhand
          - runner: macos-15-intel
            asset: hexhand-darwin-x64
            binary: target/release/hexhand
          - runner: macos-15
            asset: hexhand-darwin-arm64
            binary: target/release/hexhand
          - runner: windows-2022
            asset: hexhand-win32-x64.exe
            binary: target/release/hexhand.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install musl toolchain
        if: matrix.target != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add --toolchain stable "${{ matrix.target }}"

      - name: Build release binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo +stable build --release --locked --target "${{ matrix.target }}"
          else
            cargo +stable build --release --locked
          fi

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          mkdir -p release
          find artifacts -type f -name 'hexhand-*' -exec cp {} release/ \;
          cd release
          sha256sum hexhand-* > SHA256SUMS
          ls -la

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
